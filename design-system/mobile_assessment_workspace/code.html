<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col antialiased">
<!-- TopNavBar (Shared Component) - Mobile Adaptation (Links hidden, Actions preserved) -->
<header class="flex justify-between items-center w-full px-container-padding h-16 sticky top-0 z-50 bg-surface-white border-b border-outline-variant shadow-sm shrink-0">
<!-- Brand Logo -->
<div class="font-headline-md text-headline-md font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">public</span>
            CrisisMap
        </div>
<!-- Navigation Links (Hidden on Mobile) -->
<nav class="hidden md:flex gap-6 h-full items-center">
<a class="text-on-surface-variant hover:text-primary-container transition-colors h-full flex items-center font-body-md text-body-md" href="#">Dashboard</a>
<a class="text-primary font-semibold border-b-2 border-primary pb-1 h-full flex items-center font-body-md text-body-md opacity-80 transition-opacity" href="#">Map View</a>
<a class="text-on-surface-variant hover:text-primary-container transition-colors h-full flex items-center font-body-md text-body-md" href="#">Assessment Reports</a>
<a class="text-on-surface-variant hover:text-primary-container transition-colors h-full flex items-center font-body-md text-body-md" href="#">Resource Hub</a>
</nav>
<!-- Trailing Actions -->
<div class="flex items-center gap-4 text-primary">
<button aria-label="Notifications" class="hover:text-primary-container transition-colors flex items-center justify-center p-1">
<span class="material-symbols-outlined">notifications</span>
</button>
<button aria-label="Profile" class="hover:text-primary-container transition-colors flex items-center justify-center p-1">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Workspace Area -->
<main class="flex-1 relative w-full h-full overflow-hidden flex flex-col">

<div class="absolute inset-0 w-full h-full bg-surface-variant z-0">

<polygon class="text-status-severe opacity-40 stroke-status-severe stroke-[0.5px]" fill="currentColor" points="20,30 40,25 55,45 35,60" style="stroke-opacity: 1;"></polygon>
</svg>
</div>
<!-- Floating UI Layer (Z-10) -->
<div class="absolute inset-0 z-10 pointer-events-none p-4 flex flex-col justify-between">
<!-- Top Controls Area -->
<div class="flex flex-col gap-3 pointer-events-auto w-full">
<!-- Location Search -->
<div class="w-full bg-surface-white rounded-lg shadow-sm border border-outline-variant flex items-center px-3 py-2">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">search</span>
<input class="bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface w-full placeholder-on-surface-variant/50" placeholder="Search coordinates or place..." type="text" value="Sector 7G, Antakya"/>
<button class="ml-2 text-primary hover:bg-surface-container-low rounded p-1">
<span class="material-symbols-outlined text-[20px]">my_location</span>
</button>
</div>
<!-- Imagery Source Indicators -->
<div class="flex gap-2 flex-wrap">
<div class="bg-surface-white/90 backdrop-blur-sm border border-outline-variant rounded px-2 py-1 flex items-center gap-1.5 shadow-sm">
<div class="w-2 h-2 rounded-full bg-status-intact"></div>
<span class="font-label-mono text-label-mono text-on-surface">MAXAR (LIVE)</span>
</div>
<div class="bg-surface-white/90 backdrop-blur-sm border border-outline-variant rounded px-2 py-1 flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-[14px] text-outline">cloud_off</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">SAR PENDING</span>
</div>
</div>
</div>

<span class="material-symbols-outlined">pan_tool</span>
</button>
<button class="w-10 h-10 bg-surface-white border border-primary ring-1 ring-primary rounded shadow-sm flex items-center justify-center text-primary bg-primary-container/10 transition-colors" title="Draw Polygon">

</button>
<button class="w-10 h-10 bg-surface-white border border-outline-variant rounded shadow-sm flex items-center justify-center text-on-surface-variant hover:text-status-destroyed hover:bg-surface-container-low transition-colors" title="Clear Selection">
<span class="material-symbols-outlined">delete</span>
</button>
<div class="h-px w-6 bg-outline-variant mx-auto my-1"></div>
<button class="w-10 h-10 bg-surface-white border border-outline-variant rounded shadow-sm flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors" title="Layers">
<span class="material-symbols-outlined">layers</span>
</button>
</div>

<div class="h-[397px]"></div>

<h2 class="font-headline-sm text-headline-sm text-on-surface">Assessment Parameters</h2>
<button class="text-on-surface-variant hover:text-primary p-1">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Parameter: Analysis Type (Segmented Control) -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wide">Analysis Model</label>
<div class="flex p-1 bg-surface-container-high rounded-lg w-full">
<button class="flex-1 py-1.5 bg-surface-white shadow-sm rounded text-primary font-body-sm text-body-sm font-semibold">Damage</button>
<button class="flex-1 py-1.5 text-on-surface-variant hover:text-on-surface font-body-sm text-body-sm rounded">Flood</button>
<button class="flex-1 py-1.5 text-on-surface-variant hover:text-on-surface font-body-sm text-body-sm rounded">Fire</button>
</div>
</div>
<!-- Parameter: AOI Details -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wide">Selected Area</label>
<div class="bg-surface-container-low border border-outline-variant rounded p-3 flex justify-between items-center">
<div class="flex flex-col">

</div>
<div class="text-right flex flex-col">

</div>
</div>
</div>

<span class="material-symbols-outlined absolute left-3 top-2.5 text-outline text-[18px]">calendar_today</span>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="px-5 py-4 bg-surface-white border-t border-surface-container-highest shrink-0">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm py-3 rounded-lg flex justify-center items-center gap-2 transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
                    Run Assessment
                </button>
</div>
