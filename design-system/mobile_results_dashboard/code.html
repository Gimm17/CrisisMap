<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CrisisMap - Mobile Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#a3eeff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#dbe4e6",
                        "tertiary-fixed": "#b4eded",
                        "on-secondary-fixed-variant": "#004e5a",
                        "status-minor": "#EAB308",
                        "on-tertiary-fixed-variant": "#0f4f4f",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e1eaec",
                        "background": "#f2fbfd",
                        "status-severe": "#EA580C",
                        "secondary-fixed-dim": "#76d4e7",
                        "tertiary": "#0a4c4c",
                        "on-secondary-container": "#006b7a",
                        "inverse-on-surface": "#e9f2f4",
                        "primary-container": "#09637e",
                        "on-primary-fixed-variant": "#004d63",
                        "on-tertiary-container": "#a5dede",
                        "on-surface": "#141d1f",
                        "outline-variant": "#bfc8cd",
                        "on-primary-fixed": "#001f2a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#8debff",
                        "outline": "#70787d",
                        "on-primary-container": "#98ddfc",
                        "on-secondary-fixed": "#001f25",
                        "surface-container-low": "#ecf5f7",
                        "surface-dim": "#d3dcde",
                        "on-tertiary-fixed": "#002020",
                        "surface-container-highest": "#dbe4e6",
                        "inverse-surface": "#293234",
                        "primary": "#004a5f",
                        "surface-tint": "#116681",
                        "primary-fixed": "#bce9ff",
                        "inverse-primary": "#8bd0ef",
                        "surface-container": "#e6eff1",
                        "on-error-container": "#93000a",
                        "on-background": "#141d1f",
                        "border-muted": "#D1D5DB",
                        "status-destroyed": "#DC2626",
                        "primary-fixed-dim": "#8bd0ef",
                        "surface": "#f2fbfd",
                        "surface-white": "#FFFFFF",
                        "on-surface-variant": "#40484c",
                        "surface-bright": "#f2fbfd",
                        "secondary": "#006877",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#98d1d1",
                        "on-secondary": "#ffffff",
                        "status-moderate": "#F59E0B",
                        "status-intact": "#22C55E",
                        "tertiary-container": "#2b6464",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-width": "360px",
                        "gutter": "1rem",
                        "container-padding": "1.5rem",
                        "control-gap": "0.5rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "stat-value": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "stat-value": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-full flex flex-col overflow-hidden relative">
<!-- Top Navigation App Bar (Mobile Pivot from TopNavBar) -->
<header class="bg-surface-white flex justify-between items-center w-full px-container-padding h-16 sticky top-0 z-50 shadow-sm border-none md:hidden shrink-0">
<div class="font-headline-md text-headline-md font-bold text-primary">CrisisMap</div>
<div class="flex items-center gap-control-gap text-primary">
<button class="p-1 flex items-center justify-center hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="p-1 flex items-center justify-center hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Map Canvas (Surface 1) -->
<main class="flex-grow relative z-0 bg-surface-variant w-full h-full" data-alt="A highly detailed satellite map view of an urban sector showing dense city blocks and infrastructure. The map is rendered in a realistic top-down perspective, characterized by a pragmatic, high-resolution aesthetic suitable for operational analysis. The overall color palette is muted and cool, with shades of gray and subtle earth tones, forming a calm backdrop. High-contrast, sharp details define the streets and building footprints." data-location="Sector 7G" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCacAg0bp7oPSGLXXnJfXkvCPqbnL-Injcki8FLid0ipg0KceU1SRiQP8YEhyTK1w0RT1XtC7et8EuZAnFWvoTOJJFR7owELqHCGGasRY8me_2v-CjvrJYIqH36W9zn9PzW0ICa5-tY2fdgx1Wsd6zlJELdmfbUUPy3L3nlRpHL1x87VSM4o-OWZnZKpiKSaT8T_wlDUfZR352EjxREPJzT_vQEYVixsN7q-Sdt_Y5XMsdbE6c6xxoogZYKF8tFjOCyQeFb8Q71klkY'); background-size: cover; background-position: center;">
<!-- Polygon Overlays -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 400 800">
<!-- Severe Damage Polygon -->
<polygon class="fill-status-severe/40 stroke-status-severe stroke-[2px]" points="150,200 220,180 250,260 180,290"></polygon>
<!-- Destroyed Polygon -->
<polygon class="fill-status-destroyed/40 stroke-status-destroyed stroke-[2px]" points="80,400 120,380 160,450 100,480"></polygon>
<!-- Intact Polygon -->
<polygon class="fill-status-intact/40 stroke-status-intact stroke-[2px]" points="280,300 340,280 360,350 300,380"></polygon>
</svg>
<!-- Floating Map Controls -->
<div class="absolute right-4 top-4 flex flex-col gap-2 z-10">
<button class="bg-surface-white w-10 h-10 flex items-center justify-center rounded shadow-sm border border-border-muted text-primary hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
<button class="bg-surface-white w-10 h-10 flex items-center justify-center rounded shadow-sm border border-border-muted text-primary hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="bg-surface-white w-10 h-10 flex items-center justify-center rounded shadow-sm border border-border-muted text-primary mt-4 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</main>
<!-- Bottom Drawer (Results Summary & Tools) -->
<!-- Positioned above the bottom nav, taking up ~45% of height -->
<section class="absolute bottom-[4.5rem] w-full bg-surface-white rounded-t-xl shadow-[0_-4px_16px_rgba(0,0,0,0.05)] border-t border-border-muted z-40 flex flex-col max-h-[442px]">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center py-3 shrink-0 cursor-grab">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Drawer Content -->
<div class="px-container-padding pb-container-padding overflow-y-auto flex-grow flex flex-col gap-6">
<!-- Header -->
<div>
<h2 class="font-headline-sm text-headline-sm font-bold text-on-surface">Sector 7G Analysis</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">High-Priority Zone</p>
</div>
<!-- Summary Stats Bento Grid -->
<div class="grid grid-cols-2 gap-4 shrink-0">
<div class="bg-surface border border-border-muted p-4 rounded-lg flex flex-col gap-1">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Buildings Assessed</span>
<span class="font-stat-value text-stat-value text-primary">1,402</span>
</div>
<div class="bg-surface border border-status-severe/30 p-4 rounded-lg flex flex-col gap-1 shadow-sm relative overflow-hidden">
<div class="absolute inset-0 bg-status-severe/5 pointer-events-none"></div>
<span class="font-label-mono text-label-mono text-status-severe uppercase tracking-wider relative z-10">Severe Damage</span>
<span class="font-stat-value text-stat-value text-status-severe relative z-10">348</span>
</div>
</div>
<!-- Infrastructure Layers List -->
<div class="flex flex-col gap-3 shrink-0">
<h3 class="font-label-mono text-label-mono text-outline uppercase tracking-wider mb-1">Infrastructure Overlay</h3>
<!-- Toggle: Power Grid -->
<label class="flex items-center justify-between bg-surface p-3 rounded-lg border border-border-muted cursor-pointer active:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">power</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Power Grid</span>
</div>
<!-- Custom Toggle UI (Active) -->
<div class="w-11 h-6 bg-primary rounded-full relative shadow-inner">
<div class="absolute right-1 top-1 w-4 h-4 bg-surface-white rounded-full shadow-sm"></div>
</div>
</label>
<!-- Toggle: Water Supply -->
<label class="flex items-center justify-between bg-surface-container-lowest p-3 rounded-lg border border-border-muted cursor-pointer active:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">water_drop</span>
<span class="font-body-md text-body-md text-on-surface-variant">Water Supply</span>
</div>
<!-- Custom Toggle UI (Inactive) -->
<div class="w-11 h-6 bg-surface-variant border border-outline-variant rounded-full relative shadow-inner">
<div class="absolute left-1 top-1 w-4 h-4 bg-outline rounded-full shadow-sm"></div>
</div>
</label>
</div>
</div>
</section>
<!-- Bottom Navigation Shell (Mapped from SideNavBar JSON) -->
<!-- PROHIBITION: No top/bottom border lines. Use background tonal shift/shadow. -->
<nav class="bg-surface-container-low shadow-[0_-4px_10px_rgba(0,0,0,0.03)] w-full h-[4.5rem] fixed bottom-0 z-50 flex justify-around items-center px-2 pb-safe md:hidden shrink-0">
<!-- Tab 1: Live Feed -->
<button class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-lg py-1">
<span class="material-symbols-outlined">satellite_alt</span>
<span class="font-label-mono text-[10px] leading-tight font-medium">Live Feed</span>
</button>
<!-- Tab 2: Damage Layer (ACTIVE STATE based on Intent) -->
<button class="flex flex-col items-center justify-center gap-1 w-full h-full bg-secondary-container text-on-secondary-container rounded-lg py-1 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">water_damage</span>
<span class="font-label-mono text-[10px] leading-tight font-semibold">Damage Layer</span>
</button>
<!-- Tab 3: Logistics -->
<button class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-lg py-1">
<span class="material-symbols-outlined">local_shipping</span>
<span class="font-label-mono text-[10px] leading-tight font-medium">Logistics</span>
</button>
<!-- Tab 4: Infrastructure -->
<button class="flex flex-col items-center justify-center gap-1 w-full h-full text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-lg py-1">
<span class="material-symbols-outlined">domain</span>
<span class="font-label-mono text-[10px] leading-tight font-medium">Infrastructure</span>
</button>
</nav>
</body></html>
